<title>Interactive Structure Viewer</title>

<script>
(function () {
    const correctPassword = "hulab";

    if (sessionStorage.getItem("site_password_ok") === "yes") {
        return;
    }

    const input = prompt("Please enter password:");

    if (input === correctPassword) {
        sessionStorage.setItem("site_password_ok", "yes");
    } else {
        document.open();
        document.write(`
            <!DOCTYPE html>
            <html>
            <head>
                <meta charset="utf-8">
                <title>404 Not Found</title>
                <style>
                    body {
                        font-family: Arial, sans-serif;
                        margin: 40px;
                    }
                    h1 {
                        font-size: 32px;
                    }
                </style>
            </head>
            <body>
                <h1>404 Not Found</h1>
                <p>The requested URL was not found on this server.</p>
            </body>
            </html>
        `);
        document.close();

        throw new Error("404 Not Found");
    }
})();
</script>
